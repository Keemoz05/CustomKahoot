<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing - QuizYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
            --color-snow: #FAFAF9;
            --color-warm-white: #F5F3EF;
            --color-linen: #EDEBE5;
            --color-pebble: #E0DDD6;
            --color-charcoal: #1C1917;
            --color-slate: #57534E;
            --color-stone: #A8A29E;
            --color-deep-teal: #0F766E;
            --color-teal-dark: #0D6359;
            --color-seafoam: #CCFBF1;
            --color-rosewood: #B91C1C;
            --color-blush: #FEF2F2;
            --color-amber: #D97706;
            --color-forest: #15803D;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-12: 48px;

            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;
            
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
        }

        body {
            background-color: var(--color-snow);
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--color-charcoal);
        }

        .header {
            padding: var(--space-6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .logo {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 24px;
            color: var(--color-charcoal);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--color-deep-teal);
        }

        .guest-badge {
            background-color: white;
            border: 1px solid var(--color-pebble);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 500;
            color: var(--color-slate);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            box-shadow: var(--shadow-xs);
        }

        .content-area {
            flex: 1;
            padding: var(--space-4) var(--space-6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            padding: var(--space-8);
            border: 1px solid var(--color-pebble);
        }

        .view-state { display: none; }
        .view-state.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .centered-state {
            text-align: center;
            padding: var(--space-12) var(--space-4);
        }

        .centered-icon {
            font-size: 48px;
            margin-bottom: var(--space-6);
        }

        .centered-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--color-charcoal);
            margin-bottom: var(--space-2);
        }

        .centered-sub {
            color: var(--color-slate);
            font-size: 16px;
            line-height: 1.5;
        }

        .question-header {
            margin-bottom: var(--space-8);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .question-prompt {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--color-charcoal);
            margin: 0;
            line-height: 1.35;
            flex: 1;
            padding-right: var(--space-4);
        }

        .participant-stats {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--color-slate);
            font-size: 15px;
            background: var(--color-snow);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-full);
            font-weight: 500;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .option-btn {
            background: white;
            border: 1px solid var(--color-pebble);
            padding: var(--space-5);
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 500;
            border-radius: var(--radius-lg);
            color: var(--color-charcoal);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-xs);
            display: flex;
            align-items: center;
            min-height: 64px;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            background-color: var(--color-pebble);
            transition: background-color 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--color-stone);
            background-color: var(--color-snow);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .option-btn.locked {
            opacity: 0.7;
            pointer-events: none;
            background-color: var(--color-warm-white);
            transform: none;
            box-shadow: none;
        }

        .rank-number {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 64px;
            font-weight: 700;
            color: var(--color-deep-teal);
            margin: var(--space-6) 0;
        }
        
        .footer {
            padding: var(--space-6);
            text-align: center;
            font-size: 12px;
            color: var(--color-stone);
            margin-top: auto;
            margin-bottom: var(--space-4);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Q<span>uizYa</span></div>
        <div class="guest-badge">
            <span th:text="${guest.displayName}">Anonymous</span>
        </div>
    </div>
    
    <div class="content-area">
        <!-- State: Waiting -->
        <div id="state-waiting" class="view-state active">
            <div class="card centered-state">
                <div class="centered-icon">✨</div>
                <div class="centered-title">Welcome in</div>
                <div class="centered-sub">Look at the big screen.<br>Waiting for the host to start...</div>
            </div>
        </div>
        
        <!-- State: Question -->
        <div id="state-question" class="view-state">
            <div class="card">
                <div class="question-header">
                    <h2 id="questionPrompt" class="question-prompt">Question</h2>
                    <div class="participant-stats">
                        <span id="correctCount" th:text="${guest.correctCount}">0</span>
                        <span>⭐</span>
                    </div>
                </div>
                
                <div id="optionsContainer" class="options-grid"></div>
            </div>
        </div>
        
        <!-- State: Locked / Feedback -->
        <div id="state-feedback" class="view-state">
            <div class="card centered-state">
                <div id="feedbackIcon" class="centered-icon">⏳</div>
                <div id="feedbackText" class="centered-title">Waiting for others...</div>
            </div>
        </div>
        
        <!-- State: Rank -->
        <div id="state-rank" class="view-state">
            <div class="card centered-state">
                <div class="centered-sub">Current Rank</div>
                <div id="rankNumber" class="rank-number">--</div>
                <div class="centered-title">Keep it up!</div>
            </div>
        </div>
        
        <!-- State: Finished -->
        <div id="state-finished" class="view-state">
            <div class="card centered-state">
                <div class="centered-icon">🎉</div>
                <div class="centered-title">Event Ended</div>
                <div class="centered-sub">Thanks for playing!</div>
                
                <div style="margin-top: var(--space-8); padding-top: var(--space-6); border-top: 1px solid var(--color-pebble);">
                    <div class="centered-sub">Final Rank</div>
                    <div id="finalRankNumber" class="rank-number" style="margin: var(--space-2) 0; font-size: 48px;">--</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        Powered by QuizYa
    </div>
    
    <script th:inline="javascript">
        /*<![CDATA[*/
        const eventId = /*[[${guest.event.id}]]*/ null;
        const guestId = /*[[${guest.id}]]*/ null;
        /*]]>*/
        
        let stompClient = null;
        
        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; 
            
            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket');
                
                stompClient.subscribe('/topic/event/' + eventId + '/guest', function (message) {
                    handleEventMessage(JSON.parse(message.body));
                });
                
                stompClient.subscribe('/queue/guest/' + guestId, function (message) {
                    handleGuestMessage(JSON.parse(message.body));
                });
            });
        }
        
        function switchState(stateId) {
            document.querySelectorAll('.view-state').forEach(el => el.classList.remove('active'));
            document.getElementById(stateId).classList.add('active');
        }
        
        function handleEventMessage(msg) {
            if (msg.type === 'SHOW_QUESTION') {
                document.getElementById('questionPrompt').innerText = msg.prompt || 'Choose an option';
                const container = document.getElementById('optionsContainer');
                container.innerHTML = '';
                
                msg.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    // Optional: keep backend colors but as left border to mimic slido?
                    // Let's use it as a left border indicator
                    if(opt.color) {
                        btn.style.setProperty('--pseudo-border-color', opt.color);
                        // Apply color to the left border using border-left directly or an inline style override
                        // For the option-btn::before, we'll need to set the background color via a CSS variable
                        btn.style.borderLeftColor = opt.color;
                        btn.style.boxShadow = `inset 6px 0 0 ${opt.color}, 0 1px 2px rgba(0,0,0,0.04)`;
                    }
                    btn.innerText = opt.text;
                    btn.onclick = () => submitAnswer(opt.id, btn);
                    container.appendChild(btn);
                });
                switchState('state-question');

            } else if (msg.type === 'SHOW_LEADERBOARD') {
                switchState('state-rank');

            } else if (msg.type === 'PAUSE') {
                switchState('state-waiting');
                document.querySelector('#state-waiting .centered-title').innerText = 'Paused';
                document.querySelector('#state-waiting .centered-sub').innerText = 'Eyes to the front!';
            } else if (msg.type === 'EVENT_FINISHED') {
                switchState('state-finished');

            } else if (msg.type === 'REVEAL_ANSWER') {
                if (window.lastAnswerCorrect !== undefined) {
                    const isCorrect = window.lastAnswerCorrect;
                    document.getElementById('feedbackIcon').innerText = isCorrect ? '✅' : '❌';
                    document.getElementById('feedbackText').innerText = isCorrect ? 'Correct!' : 'Not quite.';
                    if (isCorrect) {
                        const el = document.getElementById('correctCount');
                        el.innerText = parseInt(el.innerText) + 1;
                    }
                    window.lastAnswerCorrect = undefined;
                }
            } else if (msg.type === 'EVENT_FINISHED') {
                const currentRank = document.getElementById('rankNumber').innerText;
                document.getElementById('finalRankNumber').innerText = currentRank;
                switchState('state-finished');
            }
        }
        
        function handleGuestMessage(msg) {
            if (msg.type === 'RANK_UPDATE') {
                document.getElementById('rankNumber').innerText = msg.rank;
                document.getElementById('correctCount').innerText = msg.correctCount || msg.score || 0;
            } else if (msg.type === 'KICKED') {
                switchState('state-finished');
                document.querySelector('#state-finished .centered-title').innerText = 'Removed';
                document.querySelector('#state-finished .centered-sub').innerText = 'You have been removed from this event.';
            }
        }
        
        function submitAnswer(optionId, btnElement) {
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.add('locked'));
            
            switchState('state-feedback');
            document.getElementById('feedbackIcon').innerText = '⏳';
            document.getElementById('feedbackText').innerText = 'Waiting for others...';
            
            fetch('/api/guest/' + guestId + '/answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ optionId: optionId })
            }).then(res => res.json())
              .then(data => {
                  window.lastAnswerCorrect = data.correct;
              })
              .catch(err => console.error(err));
        }
        
        connect();
    </script>
</body>
</html>
