<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.title} + ' — QuizYa'">Event — QuizYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/display.css}">
</head>
<body class="lobby-body">

    <!-- Full-screen lobby layout -->
    <div class="lobby-container">

        <!-- Top bar: branding + guest count -->
        <div class="lobby-topbar">
            <span class="brand-mark">QuizYa</span>
            <span class="guest-counter" id="guestCounter">0 joined</span>
        </div>

        <!-- Event title -->
        <h1 class="lobby-event-title" th:text="${event.title}">Event Title</h1>

        <!-- Join instruction -->
        <p class="lobby-instruction">Scan the QR code or enter the PIN at</p>
        <p class="lobby-join-url">quizya.com/join</p>

        <!-- QR Code -->
        <div class="qr-wrapper">
            <!-- The qrCodeUrl is a Base64 data URI — no external request needed -->
            <!-- th is thymeleaf, the jinja version of java -->
             <!-- event object is retrieved from displaycontroller.java -->
            <img
            
                th:if="${event.qrCodeUrl != null and !event.qrCodeUrl.isEmpty()}"
                th:src="${event.qrCodeUrl}"
                class="qr-image"
                alt="Scan to join the event"
                id="qrImage">
            <!-- Fallback if QR hasn't been generated yet -->
            <div th:unless="${event.qrCodeUrl != null and !event.qrCodeUrl.isEmpty()}"
                 class="qr-placeholder">
                <span>QR code will appear<br>when you go live</span>
            </div>
        </div>

        <!-- Join Code -->
        <div class="pin-display">
            <span class="pin-label">PIN</span>
            <span class="pin-code" th:text="${joinCode}">ABC123</span>
        </div>

        <!-- Guest name roster — names animate in via WebSocket in Week 4 -->
        <!-- For Week 3 this is a visual placeholder showing the layout is ready -->
        <div class="guest-roster" id="guestRoster">
            <p class="roster-waiting">Waiting for guests to join...</p>
        </div>

    </div>

    <!-- Fullscreen prompt on first load -->
    <div class="fullscreen-prompt" id="fullscreenPrompt">
        <button class="btn-fullscreen" id="btnFullscreen">⛶ Go Fullscreen</button>
    </div>

    <script>
        // Fullscreen toggle — the host presses this before pointing the projector
        const promptEl = document.getElementById('fullscreenPrompt');
        const btnFs = document.getElementById('btnFullscreen');

        btnFs.addEventListener('click', () => {
            document.documentElement.requestFullscreen().catch(() => {});
            promptEl.style.display = 'none';
        });

        // Hide prompt once fullscreen is active via keyboard (F11)
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) promptEl.style.display = 'none';
        });

        /* Week 4+: WebSocket STOMP subscription will go here to:
           - Receive GUEST_JOINED events and animate names into #guestRoster
           - Update #guestCounter with the live count
           - Receive GAME_START to transition to the first question slide */
    </script>
</body>
</html>
