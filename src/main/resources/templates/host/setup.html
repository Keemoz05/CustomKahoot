<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.title} + ' — Setup — QuizYa'">Event Setup - QuizYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/setup.css}">
    <script th:inline="javascript">
        window.EVENT_ID = /*[[${event.id}]]*/ 0;
    </script>
</head>
<body class="setup-layout">

    <!-- ── Top Navbar ─────────────────────────────────────── -->
    <header class="setup-header">
        <div class="header-left">
            <div class="nav-controls">
                <a th:href="@{/host/dashboard}" class="back-link">← Back</a>
            </div>
            <h1 class="header-title" th:text="${event.title}">Event Name</h1>
        </div>
        <div class="header-right">
            <button class="btn-outline btn-sm" id="btnImportLibrary">Library</button>
            <button class="btn-outline btn-sm">Settings</button>
            <!-- Start Event button: triggers Go Live flow -->
            <button class="btn-primary btn-sm" id="btnStartEvent">Start Event</button>
        </div>
    </header>

    <div class="setup-container">

        <!-- ── Left Sidebar: Question List ────────────────── -->
        <aside class="sidebar-questions" style="padding-top: var(--space-4);">
            <button id="addQuestionBtn" class="add-q-btn">+ Add slide</button>
            <div id="questionList" class="thumbnail-list">
                <!-- Dynamically populated thumbnails -->
            </div>
        </aside>

        <!-- ── Main Editor Area ───────────────────────────── -->
        <main class="editor-main">
            <div id="emptyEditorState" class="empty-editor">
                <h2>Select or add a question</h2>
            </div>

            <div id="activeEditor" class="active-editor hidden">
                <div class="floating-toolbar">
                    <div class="editor-controls-left">
                        <select id="questionTypeSelect" class="input-field type-select">
                            <option value="MULTIPLE_CHOICE">Quiz</option>
                            <option value="POLL">Poll</option>
                            <option value="WORD_CLOUD">Word Cloud</option>
                            <option value="SLIDE">Slide</option>
                        </select>
                    </div>
                    <div class="editor-controls-right">
                        <button id="deleteQuestionBtn" class="btn-ghost btn-danger-text">Delete</button>
                    </div>
                </div>

                <div class="canvas-area">
                    <textarea id="questionPrompt" class="prompt-input" placeholder="How are you feeling today?" rows="3"></textarea>

                    <!-- ── Media Upload Zone (Week 3) ──────── -->
                    <div class="media-zone" id="mediaZone">

                        <!-- Empty state: no media attached -->
                        <div class="media-empty" id="mediaEmpty">
                            <div class="media-upload-icon">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                                    <path d="m21 15-5-5L5 21"/>
                                </svg>
                            </div>
                            <p class="media-hint">Drag a photo or video here</p>
                            <p class="media-hint-sub">or <span class="media-browse-link" id="mediaBrowseLink">click to browse</span></p>
                            <!-- Hidden file input — triggered by click on the zone or browse link -->
                            <input type="file" id="mediaFileInput" accept="image/*,video/*" hidden>
                        </div>

                        <!-- Preview state: media attached -->
                        <div class="media-preview hidden" id="mediaPreview">
                            <img id="mediaPreviewImg" src="" alt="Question media" class="media-preview-img">
                            <div class="media-preview-overlay">
                                <button class="btn-remove-media" id="removeMediaBtn" title="Remove media">✕ Remove</button>
                            </div>
                        </div>

                        <!-- Uploading state: progress indicator -->
                        <div class="media-uploading hidden" id="mediaUploading">
                            <div class="upload-spinner"></div>
                            <p class="media-hint">Uploading...</p>
                        </div>

                    </div>
                    <!-- ── End Media Zone ──────────────────── -->

                    <div class="answers-section">
                        <div id="optionsContainer" class="options-grid">
                            <!-- Options injected here -->
                        </div>
                        <button id="addOptionBtn" class="btn-ghost add-opt-btn">+ Add Option</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ── Question Library Modal ─────────────────────────── -->
    <div id="libraryModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Import Template</h2>
                <button type="button" class="btn-ghost close-btn" onclick="document.getElementById('libraryModal').classList.remove('active')">✕</button>
            </div>
            <div class="modal-body">
                <div class="banks-list" id="curatedBanksList">
                    <!-- Curated banks injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- ── Lobby Launch Overlay (Week 3) ──────────────────── -->
    <!--
        Shown when the host clicks "Start Event".
        Displays the QR code and join code so the host can share them
        before opening the venue display screen.
    -->
    <div id="lobbyOverlay" class="lobby-overlay hidden">
        <div class="lobby-modal">
            <div class="lobby-modal-header">
                <h2 class="lobby-modal-title">Your event is live! 🎉</h2>
                <button class="btn-ghost close-btn" id="closeLobbyBtn">✕</button>
            </div>
            <div class="lobby-modal-body">
                <p class="lobby-modal-hint">Share this QR code or PIN with your guests.</p>

                <!-- QR Code image (populated by JS from the API response) -->
                <div class="lobby-qr-wrapper">
                    <img id="lobbyQrImg" src="" alt="Scan to join" class="lobby-qr-img">
                </div>

                <!-- PIN in large monospace -->
                <div class="lobby-pin-row">
                    <span class="lobby-pin-label">PIN</span>
                    <span class="lobby-pin-code" id="lobbyPinCode">—</span>
                </div>

                <!-- Open venue display in a new tab -->
                <a id="lobbyDisplayLink" href="#" target="_blank" class="btn-primary lobby-display-btn">
                    ⛶ Open Venue Display
                </a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/host-setup.js}"></script>
</body>
</html>
