<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing - QuizYa</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body {
            background-color: var(--color-warm-white);
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            padding: var(--space-4);
            background-color: white;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .guest-name {
            font-weight: 600;
            color: var(--color-charcoal);
        }
        .correct-display {
            font-weight: 600;
            color: var(--color-deep-teal);
        }
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--space-4);
            text-align: center;
        }
        
        /* View States */
        .view-state { display: none; width: 100%; max-width: 600px; }
        .view-state.active { display: block; }
        
        /* Waiting State */
        .waiting-text { font-family: 'Fraunces', serif; font-size: var(--text-2xl); color: var(--color-slate); }
        .waiting-sub { color: var(--color-pebble); margin-top: var(--space-4); }
        
        /* Question State */
        .question-prompt { font-family: 'Plus Jakarta Sans', sans-serif; font-size: var(--text-xl); margin-bottom: var(--space-8); }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
        .option-btn { 
            padding: var(--space-6); 
            font-size: var(--text-lg); 
            font-weight: 600; 
            border: 2px solid transparent; 
            border-radius: var(--radius-lg); 
            color: white; 
            cursor: pointer; 
            transition: transform 0.1s, opacity 0.2s; 
            text-align: center;
            word-wrap: break-word;
        }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.locked { opacity: 0.6; pointer-events: none; border-color: var(--color-charcoal); }
        
        /* Feedback State */
        .feedback-state { margin-top: var(--space-8); }
        .feedback-icon { font-size: 48px; margin-bottom: var(--space-4); }
        .feedback-text { font-size: var(--text-xl); font-weight: 600; }
        
        /* Rank State */
        .rank-card { background: white; padding: var(--space-8); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); }
        .rank-number { font-size: 64px; font-weight: 700; color: var(--color-deep-teal); margin: var(--space-4) 0; }
        .rank-label { font-size: var(--text-lg); color: var(--color-slate); }
    </style>
</head>
<body>
    <div class="header">
        <div class="guest-name" th:text="${guest.displayName}">Guest Name</div>
        <div class="correct-display">Correct: <span id="correctCount" th:text="${guest.correctCount}">0</span></div>
    </div>
    
    <div class="content-area">
        <!-- State: Waiting -->
        <div id="state-waiting" class="view-state active">
            <h2 class="waiting-text">You're in!</h2>
            <p class="waiting-sub">Look at the big screen.<br>Waiting for the host to start...</p>
        </div>
        
        <!-- State: Question -->
        <div id="state-question" class="view-state">
            <div id="questionPrompt" class="question-prompt"></div>
            <div id="optionsContainer" class="options-grid"></div>
        </div>
        
        <!-- State: Locked / Feedback -->
        <div id="state-feedback" class="view-state">
            <div class="feedback-state">
                <div id="feedbackIcon" class="feedback-icon">⏳</div>
                <div id="feedbackText" class="feedback-text">Waiting for others...</div>
            </div>
        </div>
        
        <!-- State: Rank -->
        <div id="state-rank" class="view-state">
            <div class="rank-card">
                <div class="rank-label">Current Rank</div>
                <div id="rankNumber" class="rank-number">--</div>
                <div class="rank-label">Keep it up!</div>
            </div>
        </div>
        
        <!-- State: Finished -->
        <div id="state-finished" class="view-state">
            <h2 class="waiting-text" style="color: var(--color-deep-teal);">Event Ended</h2>
            <p class="waiting-sub" style="font-size: 1.25rem;">Thanks for playing!</p>
            <div class="rank-card" style="margin-top: 2rem; background: var(--color-warm-white); box-shadow: none; border: 2px solid var(--color-pebble);">
                <div class="rank-label">Final Rank</div>
                <div id="finalRankNumber" class="rank-number" style="color: var(--color-charcoal);">--</div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        /*<![CDATA[*/
        const eventId = /*[[${guest.event.id}]]*/ null;
        const guestId = /*[[${guest.id}]]*/ null;
        /*]]>*/
        
        let stompClient = null;
        
        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // Disable debug logging
            
            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket');
                
                // PUBLIC channel: receives game-state events broadcast by
                // HostApiController's live-control endpoints (Week 5).
                // Events: SHOW_QUESTION, LOCK_ANSWERS, REVEAL_ANSWER,
                //         SHOW_LEADERBOARD, PAUSE, RESUME
                stompClient.subscribe('/topic/event/' + eventId + '/guest', function (message) {
                    handleEventMessage(JSON.parse(message.body));
                });
                
                // PRIVATE channel: receives messages sent only to this specific
                // guest via EventService.broadcastToGuest(guestId, payload).
                // Currently only used for RANK_UPDATE, which tells the guest
                // their personal rank after the host triggers the leaderboard.
                stompClient.subscribe('/queue/guest/' + guestId, function (message) {
                    handleGuestMessage(JSON.parse(message.body));
                });
            });
        }
        
        function switchState(stateId) {
            document.querySelectorAll('.view-state').forEach(el => el.classList.remove('active'));
            document.getElementById(stateId).classList.add('active');
        }
        
        function handleEventMessage(msg) {
            // SHOW_QUESTION: Host pressed "Next Slide" — display the question
            // prompt and render answer buttons with the option colours.
            if (msg.type === 'SHOW_QUESTION') {
                document.getElementById('questionPrompt').innerText = msg.prompt || 'Choose an option';
                const container = document.getElementById('optionsContainer');
                container.innerHTML = '';
                
                msg.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.style.backgroundColor = opt.color || '#333';
                    btn.innerText = opt.text;
                    btn.onclick = () => submitAnswer(opt.id, btn);
                    container.appendChild(btn);
                });
                switchState('state-question');

            // SHOW_LEADERBOARD: Host pressed "Leaderboard" — switch to the
            // rank card view.  The actual rank number gets filled in by a
            // separate RANK_UPDATE message on the private channel.
            } else if (msg.type === 'SHOW_LEADERBOARD') {
                switchState('state-rank');

            // PAUSE: Host activated Storyteller Pause — show a calming
            // "Paused / Eyes to the front!" screen so guests look up.
            } else if (msg.type === 'PAUSE') {
                switchState('state-waiting');
                document.querySelector('#state-waiting .waiting-text').innerText = 'Paused';
                document.querySelector('#state-waiting .waiting-sub').innerText = 'Eyes to the front!';

            // REVEAL_ANSWER: Week 5 deferred-reveal pattern.
            // When the guest submitted their answer, the HTTP response
            // included { correct: true/false } which was stashed in
            // window.lastAnswerCorrect.  We don't show correct/incorrect
            // feedback immediately — we wait until the host presses
            // "Reveal Answer" so all guests learn the answer at the same
            // time.  This prevents early-submitters from spoiling the answer.
            } else if (msg.type === 'REVEAL_ANSWER') {
                if (window.lastAnswerCorrect !== undefined) {
                    const isCorrect = window.lastAnswerCorrect;
                    document.getElementById('feedbackIcon').innerText = isCorrect ? '✅' : '❌';
                    document.getElementById('feedbackText').innerText = isCorrect ? 'Correct!' : 'Not quite.';
                    if (isCorrect) {
                        const el = document.getElementById('correctCount');
                        el.innerText = parseInt(el.innerText) + 1;
                    }
                    // Clear the stashed value so it doesn't re-trigger
                    window.lastAnswerCorrect = undefined;
                }
            } else if (msg.type === 'EVENT_FINISHED') {
                const currentRank = document.getElementById('rankNumber').innerText;
                document.getElementById('finalRankNumber').innerText = currentRank;
                switchState('state-finished');
            }
        }
        
        // Week 5: Handles private messages sent to /queue/guest/{guestId}.
        // Only RANK_UPDATE is sent here currently.  It arrives when the host
        // clicks "Leaderboard", and contains this guest's rank and correctCount.
        function handleGuestMessage(msg) {
            if (msg.type === 'RANK_UPDATE') {
                document.getElementById('rankNumber').innerText = msg.rank;
                document.getElementById('correctCount').innerText = msg.correctCount || msg.score || 0;
            }
        }
        
        function submitAnswer(optionId, btnElement) {
            // Lock UI
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.add('locked'));
            
            // Show calm waiting state
            switchState('state-feedback');
            document.getElementById('feedbackIcon').innerText = '⏳';
            document.getElementById('feedbackText').innerText = 'Waiting for others...';
            
            // Send the selected option to the backend.  The response
            // includes { correct: true/false } which we stash in
            // window.lastAnswerCorrect.  We do NOT show the result yet —
            // it's deferred until the host presses "Reveal Answer" and
            // a REVEAL_ANSWER event arrives on the WebSocket (see above).
            fetch('/api/guest/' + guestId + '/answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ optionId: optionId })
            }).then(res => res.json())
              .then(data => {
                  window.lastAnswerCorrect = data.correct;
              })
              .catch(err => console.error(err));
        }
        
        // Init
        connect();
    </script>
</body>
</html>
