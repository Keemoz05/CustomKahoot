<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.title} + ' — Live Controls — QuizYa'">Live Controls - QuizYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/host-live.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script th:inline="javascript">
        window.EVENT_ID = /*[[${event.id}]]*/ 0;
        window.JOIN_CODE = /*[[${event.joinCode}]]*/ '';
        window.INITIAL_INDEX = /*[[${event.currentQuestionIndex}]]*/ 0;
    </script>
</head>
<body class="live-layout">

    <!-- ═══ HEADER ══════════════════════════════════════════════════════════ -->
    <header class="live-header">
        <div style="display:flex;align-items:center;gap:var(--space-3);min-width:0;flex:1;">
            <h1 class="header-title" th:text="${event.title}">Event Title</h1>
            <div class="status-badge" id="statusBadge">LOBBY</div>
        </div>
        <button id="btnToggleSidebar" class="btn-header-toggle">
            <!-- Layout icon -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="18" rx="2"/>
                <path d="M9 3v18"/>
                <path d="M15 9h4"/>
            </svg>
            <span id="toggleSidebarText">Show Previews</span>
        </button>
    </header>

    <!-- ═══ LEFT NAV SIDEBAR ════════════════════════════════════════════════ -->
    <aside class="nav-sidebar">
        <div class="nav-event-header">
            <h3 class="nav-event-title" th:text="${event.title}">Event Title</h3>
            <span class="nav-event-date" th:text="${#temporals.format(event.createdAt, 'dd MMM yyyy')}">28 Apr 2026</span>
            <span class="nav-guest-count">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px;">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span id="navGuestCount">0</span> guests
            </span>
        </div>

        <div class="nav-progress">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width:0%"></div>
            </div>
            <span class="progress-label" id="progressLabel">0 / 0</span>
        </div>

        <ul class="nav-list" id="navList">
            <li class="nav-item flat-item active" data-type="flat" data-index="0">
                <span class="nav-dot active"></span> Welcome
            </li>
        </ul>

        <div class="nav-footer">
            <button id="btnAddSegment" class="nav-footer-btn">
                + Add Segment
            </button>
            <!-- Single consolidated End Event — only lives here -->
            <button id="btnEndEvent" class="nav-footer-btn nav-footer-end">
                ⏹ End Event
            </button>
        </div>
    </aside>

    <!-- ═══ CENTER DASHBOARD ════════════════════════════════════════════════ -->
    <main class="center-dashboard">

        <!-- ── Preview Zone: current slide preview ────────────────────── -->
        <div class="preview-zone">
            <div class="slide-meta">
                <span class="slide-counter">
                    Slide <span id="selectedSlideNum">1</span> / <span id="totalSlides">0</span>
                </span>
                <span id="outOfSyncBadge" class="out-of-sync-badge">⚠ Not Live</span>
                <span id="liveBadge" class="live-badge" style="display:none;">🔴 Live on Screen</span>
            </div>

            <!-- Left-aligned question heading -->
            <h2 id="questionPreview" class="question-preview">Waiting to start...</h2>

            <div id="previewOptions" class="preview-options-grid"></div>

            <div id="feedbackChart" class="feedback-chart">
                <h4>Live Audience Feedback</h4>
                <div id="chartBars" style="display:flex;flex-direction:column;gap:6px;"></div>
            </div>

            <button id="btnPushLive" class="btn-push-live">
                <div class="btn-push-inner">
                    <div class="btn-push-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
                        </svg>
                    </div>
                    <div class="btn-push-label">
                        <span class="btn-push-main">Make This Live</span>
                        <span class="btn-push-sub">Apply this view to all screens</span>
                    </div>
                </div>
            </button>
        </div>

        <!-- ── Controls Zone: action buttons ──────────────────────────── -->
        <div class="controls-zone">
            <div class="controls-section-label">Controls</div>

            <div class="controls-grid">

                <!-- Previous Slide -->
                <button id="btnPrev" class="btn-control">
                    <div class="btn-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
                        </svg>
                    </div>
                    Previous
                </button>

                <!-- PRIMARY: Next Slide -->
                <button id="btnNext" class="btn-control btn-next">
                    <div class="btn-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
                        </svg>
                    </div>
                    Next Slide
                </button>

                <!-- Lock Answers -->
                <button id="btnLock" class="btn-control">
                    <div class="btn-icon">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </div>
                    Lock
                </button>

                <!-- Show Feedback -->
                <button id="btnFeedback" class="btn-control">
                    <div class="btn-icon">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                    </div>
                    Feedback
                </button>

                <!-- Reveal Answer -->
                <button id="btnReveal" class="btn-control">
                    <div class="btn-icon">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                    </div>
                    Reveal
                </button>

            </div>

            <!-- Storyteller Pause -->
            <div class="pause-toggle">
                <span class="pause-label">Storyteller Pause</span>
                <div id="togglePause" class="toggle-switch">
                    <div class="toggle-knob"></div>
                </div>
            </div>
        </div>

        <!-- ── Soundboard Strip ────────────────────────────────────────── -->
        <div class="soundboard-strip">
            <div class="controls-section-label">Soundboard</div>
            <div class="sound-buttons">
                <button class="sound-btn" data-sound="drumroll">🥁</button>
                <button class="sound-btn" data-sound="applause">👏</button>
                <button class="sound-btn" data-sound="buzzer">❌</button>
                <button class="sound-btn" data-sound="tick">⏰</button>
                <button class="sound-btn" data-sound="tada">🎉</button>
                <button class="sound-btn" data-sound="suspense">😰</button>
            </div>
        </div>

        <!-- ── Audience Overview ───────────────────────────────────────── -->
        <section class="audience-overview" id="audienceOverview">
            <div class="audience-header">
                <h3>Audience</h3>
                <span class="guest-count-badge" id="guestCountBadge">0</span>
                <!-- Hidden spans kept for JS compatibility -->
                <span style="display:none;" id="guestCount">0</span>
                <span style="display:none;" id="answerCount">0</span>
            </div>
            <input type="text" id="guestSearch" class="guest-search" placeholder="Search guests...">
            <ul class="guest-list" id="guestList"></ul>
        </section>
    </main>

    <!-- ═══ RIGHT PREVIEW SIDEBAR ═══════════════════════════════════════════ -->
    <aside class="preview-sidebar">
        <div class="sidebar-content">

            <!-- Projector: 16:9 widescreen -->
            <div class="preview-frame projector-frame">
                <div class="preview-frame-label">Projector View</div>
                <div class="iframe-zoom-wrap projector-wrap">
                    <iframe th:src="'/display/' + ${event.joinCode}" id="projectorPreview"></iframe>
                </div>
            </div>

            <!-- Audience: full-width zoomed phone view -->
            <div class="preview-frame audience-frame">
                <div class="preview-frame-label">Audience View</div>
                <div class="iframe-zoom-wrap phone-wrap">
                    <iframe th:src="'/display/' + ${event.joinCode} + '/preview-play'" id="audiencePreview"></iframe>
                </div>
            </div>

        </div>
    </aside>

    <script th:src="@{/js/host-live.js}"></script>
</body>
</html>
