<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audience Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        body {
            background-color: var(--color-warm-white);
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .preview-launcher {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            text-align: center;
            max-width: 300px;
        }
        h2 { margin-top: 0; font-family: 'Fraunces', serif; color: var(--color-charcoal); }
        .btn-launch {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-launch:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="preview-launcher">
        <h2>Simulate Guest</h2>
        <p style="color: var(--color-pebble); font-size: 0.9rem;">Join the event as a mock guest to see exactly what they see.</p>
        <form method="POST" action="/join">
            <input type="hidden" name="pin" th:value="${event.joinCode}">
            <!-- Generate a random name so multiple previews don't clash -->
            <input type="hidden" name="displayName" id="mockName">
            <button type="submit" class="btn-launch">Join as Mock</button>
        </form>
    </div>
    <script>
        document.getElementById('mockName').value = "Mock Guest " + Math.floor(Math.random() * 1000);
    </script>
</body>
</html>
