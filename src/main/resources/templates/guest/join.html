<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Event - QuizYa</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        body {
            background-color: var(--color-warm-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: var(--space-4);
        }
        .landing-header { margin-bottom: var(--space-8); font-family: 'Fraunces', serif; font-size: var(--text-2xl); font-weight: 600; display: flex; justify-content: center; }
        .join-card { background-color: white; padding: var(--space-8); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); width: 100%; max-width: 400px; text-align: center; }
        .join-title { font-family: 'Fraunces', serif; font-size: var(--text-3xl); margin-bottom: var(--space-6); color: var(--color-charcoal); }
        .form-group { margin-bottom: var(--space-4); text-align: left; }
        .form-label { display: block; font-size: var(--text-sm); font-weight: 500; color: var(--color-slate); margin-bottom: var(--space-2); }
        .form-input { width: 100%; padding: var(--space-3) var(--space-4); font-size: var(--text-base); border: 1px solid var(--color-pebble); border-radius: var(--radius-md); box-sizing: border-box; font-family: inherit; transition: border-color 0.2s; }
        .form-input:focus { outline: none; border-color: var(--color-deep-teal); }
        .form-input:disabled { background-color: var(--color-warm-white); color: var(--color-slate); }
        .btn-primary-filled { width: 100%; padding: var(--space-3) var(--space-6); font-size: var(--text-lg); font-weight: 600; text-align: center; border-radius: var(--radius-md); text-decoration: none; transition: 0.2s ease; background-color: var(--color-deep-teal); color: white; border: none; cursor: pointer; margin-top: var(--space-4); }
        .btn-primary-filled:hover { background-color: var(--color-teal-dark); }
        .error-message { color: #d93025; font-size: var(--text-sm); margin-bottom: var(--space-4); text-align: left; }
    </style>
</head>
<body>
    <div class="landing-header">
        <span style="color: var(--color-deep-teal);">Q</span>uizYa
    </div>
    
    <div class="join-card">
        <h1 class="join-title">Join Event</h1>
        
        <div th:if="${error}" class="error-message" th:text="${error}"></div>
        
        <form th:action="@{/join}" method="post">
            <div class="form-group" th:style="${pin != null && !pin.isEmpty() ? 'display:none;' : ''}">
                <label for="pin" class="form-label">Game PIN</label>
                <input type="text" id="pin" name="pin" class="form-input" placeholder="Enter PIN" th:value="${pin}" th:required="${pin == null || pin.isEmpty()}">
            </div>
            
            <div class="form-group">
                <label for="displayName" class="form-label">Your Name</label>
                <input type="text" id="displayName" name="displayName" class="form-input" placeholder="How should we call you?" required autofocus autocomplete="off">
            </div>
            
            <button type="submit" class="btn-primary-filled">Join Game</button>
        </form>
    </div>
</body>
</html>
