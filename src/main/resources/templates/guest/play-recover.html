<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recovering Session - QuizYa</title>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = sessionStorage.getItem('quizya_session_token');
            if (token) {
                window.location.href = '/play?token=' + token;
            } else {
                window.location.href = '/join';
            }
        });
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; color: #555;">
    Recovering session...
</body>
</html>
